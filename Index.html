<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frame Citra Satelit</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#d9dde5;--ac:#7030a0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161b;--card:#1e2128;--tx:#e8eaf0;--mut:#9aa1b0;--bd:#343842}}
:root[data-theme="dark"]{--bg:#14161b;--card:#1e2128;--tx:#e8eaf0;--mut:#9aa1b0;--bd:#343842}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:300px 1fr}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
h1{font-size:17px;margin:0 0 12px}
label{display:block;font-weight:600;font-size:12px;color:var(--mut);margin:12px 0 4px}
input[type=date],input[type=time],select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input[type=range]{width:100%;accent-color:var(--ac)}
.row{display:flex;gap:8px}
.drop{border:2px dashed var(--bd);border-radius:10px;padding:14px;text-align:center;color:var(--mut);cursor:pointer}
.drop.on{border-color:var(--ac);color:var(--ac)}
.seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);color:var(--tx);padding:8px;font:inherit;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
.btn{width:100%;margin-top:16px;padding:11px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:600 14px system-ui;cursor:pointer}
.btn.alt{background:var(--bg);color:var(--tx);border:1px solid var(--bd);margin-top:8px}
.stage{overflow-x:auto}
canvas{width:100%;max-width:700px;height:auto;display:block;border:1px solid var(--bd);background:#fff;touch-action:none;cursor:move}
.hint{color:var(--mut);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
  <h1>Frame Citra Satelit</h1>
  <label>Citra satelit</label>
  <div class="drop" id="drop">Klik, seret, atau tempel (Ctrl+V) gambar di sini</div>
  <input type="file" id="file" accept="image/*" hidden>
  <button class="btn alt" id="cropBtn" style="margin-top:8px">✂ Crop gambar</button>
  <button class="btn alt" id="clrBtn" style="margin-top:8px">🗑 Clear gambar</button>
  <label>Jenis legenda satelit</label>
  <select id="lg"><option value="hcai">Opsi 1: HCAI-Satelit (tipe awan)</option><option value="rp">Opsi 2: RP-Satelit (Rainfall Potential)</option></select>
  <label>Tanggal</label><input type="date" id="date">
  <div class="row"><div style="flex:1"><label>Jam</label><input type="time" id="time" value="17:00"></div>
  <div style="flex:1"><label>Zona waktu</label><select id="tz"><option>WIB</option><option>WITA</option><option>WIT</option></select></div></div>
  <label>Yang digeser dengan mouse/jari</label>
  <div class="seg"><button id="mBox" class="on">Kotak ungu</button><button id="mImg">Gambar</button></div>
  <label>Ukuran kotak ungu</label><input type="range" id="bs" min="20" max="140" value="50">
  <label>Zoom gambar</label><input type="range" id="zm" min="100" max="400" value="100">
  <label>Nama file (bisa diganti sebelum download)</label><input type="text" id="fn" style="width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit">
  <button class="btn" id="dl">Simpan sebagai… (PNG)</button>
  <button class="btn alt" id="cp">Salin ke clipboard</button>
</div>
<div class="card stage">
  <canvas id="c" width="1400" height="1000"></canvas>
  <div id="cropPanel" hidden style="margin-top:14px">
    <b>Crop:</b> seret di gambar untuk memilih area (rasio otomatis sama dengan frame), seret di dalam kotak untuk menggeser.
    <canvas id="cc" style="margin-top:8px;cursor:crosshair"></canvas>
    <div class="row" style="margin-top:8px"><button class="btn" id="cropOk" style="margin:0">Terapkan</button><button class="btn alt" id="cropReset" style="margin:0">Reset crop</button><button class="btn alt" id="cropX" style="margin:0">Batal</button></div>
  </div>
  <div class="hint" id="hint">Tanggal, jam, legenda, dan frame tetap. Posisi kotak ungu diingat untuk pemakaian berikutnya.</div>
</div>
</div>
<script>
const W=700,H=500,FH=460,S=2;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const IMG={x:10,y:46,w:520,h:404};
const LEG=[["Cumulonimbus","#ff0000"],["Dense","#36504f"],["High Cloud","#8ad8f8"],["Middle Cloud","#fdd25e"],["Cumulus","#ff9900"],["Stratocumulus","#aaf03c"],["St/Fog","#33cc00"],["Clear","#000000"]];
const RP=[["Very Heavy","#ff2a55"],["Heavy","#ffff4d"],["Moderate","#4dff4d"],["Slight","#80ffff"]];
const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
let img=null,crop=null,ox=0,oy=0,box={x:270,y:250},mode='box',drag=null;
try{const s=JSON.parse(localStorage.getItem('sat')||'null');if(s){box=s.box||box;if(s.bs)$('bs').value=s.bs;if(s.tz)$('tz').value=s.tz;if(s.lg)$('lg').value=s.lg;if(s.time)$('time').value=s.time}}catch(e){}
const now=new Date();$('date').value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
function save(){try{localStorage.setItem('sat',JSON.stringify({box,bs:$('bs').value,tz:$('tz').value,lg:$('lg').value,time:$('time').value}))}catch(e){}}
function title(){const d=$('date').value.split('-');if(d.length<3)return'';const t=($('time').value||'00:00').replace(':','.');
 return`Weather Satellite Image on ${MON[+d[1]-1]} ${d[2]}, ${d[0]} at ${t} LT (${$('tz').value})`}
function fit(){const z=$('zm').value/100;const sw=crop?crop.sw:img.width,sh=crop?crop.sh:img.height;const r=Math.max(IMG.w/sw,IMG.h/sh)*z;const w=sw*r,h=sh*r;
 ox=Math.min(0,Math.max(IMG.w-w,ox));oy=Math.min(0,Math.max(IMG.h-h,oy));return{w,h}}
let fnEdited=false;
function draw(){
 if(!fnEdited)$('fn').value=fname().replace(/\.png$/,'');
 ctx.setTransform(S,0,0,S,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.strokeRect(.5,.5,W-1,FH-1);
 ctx.beginPath();ctx.moveTo(0,36.5);ctx.lineTo(W,36.5);ctx.stroke();
 ctx.fillStyle='#000';ctx.textBaseline='middle';ctx.textAlign='center';const tx=title();ctx.font='bold 10px "Times New Roman",serif';
 const fs=Math.min(21,10*(W-30)/Math.max(1,ctx.measureText(tx).width));ctx.font='bold '+fs.toFixed(1)+'px "Times New Roman",serif';ctx.fillText(tx,W/2,19);ctx.textAlign='left';
 ctx.save();ctx.beginPath();ctx.rect(IMG.x,IMG.y,IMG.w,IMG.h);ctx.clip();
 if(img){const f=fit();const c=crop||{sx:0,sy:0,sw:img.width,sh:img.height};ctx.drawImage(img,c.sx,c.sy,c.sw,c.sh,IMG.x+ox,IMG.y+oy,f.w,f.h)}
 ctx.restore();ctx.strokeRect(IMG.x-.5,IMG.y-.5,IMG.w+1,IMG.h+1);
 // legend
 ctx.fillStyle='#000';ctx.font='10px Arial,sans-serif';ctx.textBaseline='alphabetic';const rp=$('lg').value==='rp',items=rp?RP:LEG,tt=rp?['Rainfall','Potential']:['Type'];
 const R0=IMG.x+IMG.w,RW=W-R0-1,BH=330,bw=30,gap=12,tH=tt.length*16+10;
 ctx.font='12px Arial,sans-serif';const lw=Math.max(...items.map(l=>ctx.measureText(l[0]).width));
 const cw=bw+gap+lw,bx=R0+(RW-cw)/2,top=IMG.y+(IMG.h-(tH+BH))/2,by=top+tH,bh=BH/items.length;
 ctx.fillStyle='#000';ctx.textBaseline='alphabetic';ctx.textAlign='center';
 tt.forEach((t,i)=>ctx.fillText(t,bx+cw/2,top+13+i*16));ctx.textAlign='left';
 items.forEach((l,i)=>{ctx.fillStyle=l[1];ctx.fillRect(bx,by+i*bh,bw,bh);
  ctx.fillStyle='#000';ctx.textBaseline='middle';ctx.fillText(l[0],bx+bw+gap,by+i*bh+bh/2)});
 ctx.lineWidth=1.5;ctx.strokeStyle='#000';ctx.strokeRect(bx,by,bw,BH);
 // keterangan lokasi di bawah frame
 ctx.lineWidth=3;ctx.strokeStyle='#7030a0';ctx.strokeRect(11.5,471.5,38,22);
 ctx.fillStyle='#000';ctx.font='bold 16px "Times New Roman",serif';ctx.textBaseline='middle';ctx.fillText(': Location',62,483);
 // location box
 const bs=+$('bs').value,bhh=bs*.78;ctx.lineWidth=3;ctx.strokeStyle='#7030a0';
 ctx.strokeRect(box.x-bs/2,box.y-bhh/2,bs,bhh);
}
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);const p=pos(e);drag={p,ox,oy,bx:box.x,by:box.y}});
cv.addEventListener('pointermove',e=>{if(!drag)return;const p=pos(e),dx=p.x-drag.p.x,dy=p.y-drag.p.y;
 if(mode==='box'){box.x=Math.max(IMG.x,Math.min(IMG.x+IMG.w,drag.bx+dx));box.y=Math.max(IMG.y,Math.min(IMG.y+IMG.h,drag.by+dy))}
 else if(img){ox=drag.ox+dx;oy=drag.oy+dy}draw()});
cv.addEventListener('pointerup',()=>{drag=null;save()});
function setMode(m){mode=m;$('mBox').classList.toggle('on',m==='box');$('mImg').classList.toggle('on',m==='img')}
$('mBox').onclick=()=>setMode('box');$('mImg').onclick=()=>setMode('img');
['date','time','tz','bs','zm','lg'].forEach(id=>$(id).addEventListener('input',()=>{draw();save()}));
function load(f){if(!f||!f.type.startsWith('image/'))return;const u=URL.createObjectURL(f),i=new Image();
 i.onload=()=>{img=i;crop=null;$('cropPanel').hidden=true;ox=oy=0;$('zm').value=100;$('drop').textContent='✓ '+(f.name||'gambar dari clipboard')+' (klik untuk ganti)';draw()};i.src=u}
$('drop').onclick=()=>$('file').click();$('file').onchange=e=>load(e.target.files[0]);
$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('on')};
$('drop').ondragleave=()=>$('drop').classList.remove('on');
$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('on');load(e.dataTransfer.files[0])};
document.addEventListener('paste',e=>{for(const it of e.clipboardData.items)if(it.type.startsWith('image/'))load(it.getAsFile())});
function blob(){return new Promise(r=>cv.toBlob(r,'image/png'))}
function fname(){return'citra_satelit_'+$('date').value.replace(/-/g,'')+'_'+$('time').value.replace(':','')+'.png'}
function msg(t){$('hint').textContent=t}
$('fn').addEventListener('input',()=>{fnEdited=true});
async function saveAs(b,name){
 if(window.showSaveFilePicker){try{const h=await showSaveFilePicker({suggestedName:name,types:[{description:'Gambar PNG',accept:{'image/png':['.png']}}]});const w=await h.createWritable();await w.write(b);await w.close();msg('Tersimpan: '+h.name);return}catch(e){if(e.name==='AbortError'){msg('Dibatalkan.');return}}}
 let d=null;try{d=await claude.use('downloads')}catch(e){}
 if(d){try{await d.save({filename:name,data:b});msg('Tersimpan sebagai '+name)}catch(e){msg(e.code==='declined'?'Download dibatalkan.':'Gagal menyimpan: '+(e.message||e.code))}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();msg('Diunduh sebagai '+name+'. Jika browser Anda tidak menanyakan lokasi, aktifkan "Tanya lokasi simpan" di pengaturan unduhan browser.')}
$('dl').onclick=async()=>{let n=($('fn').value.trim()||fname()).replace(/[\\/:*?"<>|]/g,'_');if(!/\.png$/i.test(n))n+='.png';saveAs(await blob(),n)};
$('cp').onclick=async()=>{try{await navigator.clipboard.write([new ClipboardItem({'image/png':blob()})]);msg('Tersalin. Tinggal Ctrl+V di PowerPoint/Word atau web ptsp.')}catch(e){msg('Salin tidak diizinkan di sini. Gunakan Download PNG, atau klik kanan gambar > Copy image.')}};
const cc=$('cc'),cx=cc.getContext('2d'),AR=IMG.w/IMG.h;let sel=null,cd=null,cs=1;
function openCrop(){if(!img){msg('Upload gambar dulu.');return}cs=Math.min(1,900/img.width);cc.width=img.width*cs;cc.height=img.height*cs;
 sel=crop?{x:crop.sx*cs,y:crop.sy*cs,w:crop.sw*cs,h:crop.sh*cs}:null;$('cropPanel').hidden=false;drawCrop()}
function drawCrop(){cx.clearRect(0,0,cc.width,cc.height);cx.drawImage(img,0,0,cc.width,cc.height);
 if(sel){cx.fillStyle='rgba(0,0,0,.55)';cx.beginPath();cx.rect(0,0,cc.width,cc.height);cx.rect(sel.x,sel.y,sel.w,sel.h);cx.fill('evenodd');cx.strokeStyle='#fff';cx.lineWidth=2;cx.strokeRect(sel.x,sel.y,sel.w,sel.h)}}
function cpos(e){const r=cc.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*cc.width,y:(e.clientY-r.top)/r.height*cc.height}}
cc.onpointerdown=e=>{cc.setPointerCapture(e.pointerId);const p=cpos(e);
 cd=(sel&&p.x>=sel.x&&p.x<=sel.x+sel.w&&p.y>=sel.y&&p.y<=sel.y+sel.h)?{mv:1,p,s:{...sel}}:{a:p}};
cc.onpointermove=e=>{if(!cd)return;const p=cpos(e);
 if(cd.mv){sel.x=Math.max(0,Math.min(cc.width-sel.w,cd.s.x+p.x-cd.p.x));sel.y=Math.max(0,Math.min(cc.height-sel.h,cd.s.y+p.y-cd.p.y))}
 else{const sx=p.x<cd.a.x?-1:1,sy=p.y<cd.a.y?-1:1;let w=Math.abs(p.x-cd.a.x),h=w/AR;
  const mw=sx>0?cc.width-cd.a.x:cd.a.x,mh=sy>0?cc.height-cd.a.y:cd.a.y;
  if(h>mh){h=mh;w=h*AR}if(w>mw){w=mw;h=w/AR}
  sel={x:sx>0?cd.a.x:cd.a.x-w,y:sy>0?cd.a.y:cd.a.y-h,w,h}}
 drawCrop()};
cc.onpointerup=()=>{cd=null};
$('cropBtn').onclick=openCrop;
$('clrBtn').onclick=()=>{img=null;crop=null;sel=null;ox=oy=0;$('zm').value=100;$('file').value='';$('cropPanel').hidden=true;$('drop').textContent='Klik, seret, atau tempel (Ctrl+V) gambar di sini';draw();msg('Gambar dihapus. Silakan upload gambar baru.')};
$('cropOk').onclick=()=>{if(sel&&sel.w>10){crop={sx:sel.x/cs,sy:sel.y/cs,sw:sel.w/cs,sh:sel.h/cs};ox=oy=0;$('zm').value=100}$('cropPanel').hidden=true;draw()};
$('cropReset').onclick=()=>{crop=null;sel=null;ox=oy=0;$('cropPanel').hidden=true;draw()};
$('cropX').onclick=()=>{$('cropPanel').hidden=true};
draw();
</script>
</body>
</html>
